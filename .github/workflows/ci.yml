# CI — learnlab
#
# Generated by `hexago init`. Runs `make test` and `make arch-check` on
# every push to main and every PR.
#
# AI-agent oracle contract
# ========================
# An AI coding agent can determine at any time whether it broke the
# project by running exactly one command:
#
#   make test           → exit 0 = all tests pass; non-zero = broken
#   make test-json      → same, machine-readable (-json stream)
#
# The `make test` job below is the CI expression of that contract.
#
# This project's store is postgresql, so the job starts a real postgresql
# instance and exports its connection string
# (POSTGRESQL_TEST_DSN) to the `make test` step. Without it every
# DSN-gated adapter integration test would t.Skip and CI would stay green
# without ever exercising the store (a broken keyset predicate or migration
# would ship). The sqlite-gated tests still run on the unit leg.
#
# This file is scaffold-once (ClassC in Hexago's regen taxonomy) —
# `hexago gen` will never overwrite it. Edit freely to add service
# containers, matrix jobs, or deployment steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository is public, so the job runs on a GitHub-hosted runner: a pull
# request from a fork must never execute on a self-hosted machine. The token
# only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: test + arch-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app_test
        # Container port only: Docker picks a free host port, read back as
        # job.services.postgres.ports['5432'].
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: go mod tidy (verify deps are tidy)
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test (unit + PostgreSQL adapters)
        env:
          POSTGRESQL_TEST_DSN: postgres://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/app_test?sslmode=disable
        run: make test

      - name: Architecture check (core must not import view)
        run: make arch-check
