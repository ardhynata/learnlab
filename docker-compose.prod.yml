# Production stack for learnlab.inxpired.com. See docs/deploy.md.
#
#   postgres  private network only, data in the learnlab-pg volume
#   api       private network only (never published, never routed by Caddy)
#   web       private network + `edge`; the only service Caddy can reach
#   seed      one-shot content loader: docker compose --profile seed run --rm seed
#
# `edge` is a small external network shared only with the Caddy container, so
# nothing else on the server (the other site's database, storage and API) can
# be reached from here, or reach Learnlab. Create it once on the server:
#   docker network create edge
#
# Secrets come from an untracked .env.production next to this file (see
# .env.example); nothing secret is committed.
name: learnlab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.production}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - learnlab-pg:/var/lib/postgresql/data
    networks: [private]

  api:
    image: ${LEARNLAB_IMAGE:-learnlab:latest}
    restart: unless-stopped
    command: ["app"]
    env_file: [.env.production]
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "app", "healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [private]

  web:
    image: ${LEARNLAB_IMAGE:-learnlab:latest}
    restart: unless-stopped
    command: ["web"]
    container_name: learnlab-web
    environment:
      WEB_ADDR: ":3100"
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [private, edge]

  seed:
    image: ${LEARNLAB_IMAGE:-learnlab:latest}
    profiles: [seed]
    command: ["seed"]
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

networks:
  private:
  edge:
    external: true

volumes:
  learnlab-pg:
