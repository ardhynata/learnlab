entity: Course
context: ""
display_field: title
fields:
    - name: id
      type: string
      auto: true
      required: true
    - name: path_id
      type: string
      ref: Path
    - name: slug
      type: string
      required: true
      unique: true
      max_length: 80
    - name: title
      type: string
      required: true
      max_length: 120
    - name: summary
      type: string
      required: true
      max_length: 400
    - name: topic
      type: string
      required: true
      max_length: 60
    - name: level
      type: string
      required: true
      enum_values: [beginner, intermediate, advanced]
    - name: position
      type: int
operations: [Create, GetByID, List, Update, Delete]
transports: [rest]
repository: postgresql
