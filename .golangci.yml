version: "2"

# Hexago-scaffolded project lint config — tracks the upstream hexago framework
# rules so the project's generated code and hand-written application code are
# held to the same standard. Keep this file in sync with .golangci.yml in the
# hexago repo when upgrading golangci-lint major versions.
#
# Two deliberate divergences from upstream:
#   - the `modernize` and `unparam` linters upstream enables are NOT enabled
#     here yet. They would flag patterns in the freshly-generated scaffold
#     (e.g. `interface{}`, `sort.Slice`, classic `for i := 0; i < n; i++`
#     loops) and break `golangci-lint run` on a brand-new project before
#     you've written a line — the opposite of "works out of the box". Enable
#     them once you've modernized the generated corpus; they're intentionally
#     omitted, not forgotten.
#   - the `common-false-positives` exclusion preset is still enabled here
#     (upstream dropped it); see the exclusions note below for what it
#     silences.
#
# Generated by `hexago init` (example.com/learnlab). Edit freely to add
# project-specific suppressions — `hexago gen` will not overwrite this file.

run:
  timeout: 5m

linters:
  default: standard  # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose   # missed Body.Close() on http.Response leaks file descriptors
    - copyloopvar # flags pre-Go-1.22 loop-var copies (now redundant, but harmless)
    - errorlint   # forces %w wrapping and errors.Is/As over == comparisons
    - gosec       # security audit (G115/G201/G202/G306/G401/G404/G501 etc.; what does NOT fire is under settings.gosec and exclusions)
    - misspell    # commonly-misspelled English in identifiers/comments/strings
    - nilerr      # returning nil where err != nil — usually a real bug

  settings:
    gosec:
      # Pin severity/confidence explicitly (mirrors upstream hexago) so a
      # gosec default change can't silently move the floor. golangci-lint's
      # own default is low/low, so medium/medium RAISES it: every finding
      # gosec scores below medium on either axis is filtered, which never
      # introduces new failures, so it's safe to ship in a fresh scaffold.
      # It also means these rules NEVER fire in this project:
      #   G103 unsafe calls (Low severity): filtered by severity: medium
      #   G101 hardcoded credentials (Low confidence): filtered by confidence: medium
      #   G203 unescaped HTML template (Low confidence): filtered by confidence: medium
      # No `includes:` — that would RESTRICT gosec to a subset and silently
      # disable every other rule. Every other gosec rule runs at this floor,
      # except what the exclusion preset below silences.
      severity: medium
      confidence: medium

  exclusions:
    # std-error-handling covers fmt.Fprintf to stdout and defer Close on read
    # paths. common-false-positives is a config-level silence, not a noise
    # filter: it excludes gosec findings by message text, so these are NOT
    # reported in this project:
    #   G103 excluded: "Use of unsafe calls should be audited" (also filtered above)
    #   G204 excluded: "Subprocess launched with variable" (the tainted-input
    #        G204 message still fires)
    #   G304 excluded: "Potential file inclusion via variable"
    # A file path or a subprocess built from a variable therefore goes
    # unreported. Upstream hexago dropped the preset (#5040); dropping it
    # here waits on auditing the generated corpus for those rules. Until
    # then, an intentional exception elsewhere stays an inline
    # `// #nosec Gxxx -- reason`.
    presets:
      - common-false-positives
      - std-error-handling

    # Tests get more leeway: defer os.Chdir, defer Close in fixtures, exec
    # against known-safe constants, 0o755 fixture dirs, etc. Test code runs
    # against controlled fixtures, not untrusted input — gosec's threat model
    # doesn't apply.
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
