- prompt: You want to predict how heavy a penguin is from its island, its sex and its flipper length. Which column is the target?
  options:
  - Island
  - Sex
  - Body mass
  - Flipper length
  answer: 2
  explanation: The target is the column you want to predict, and here that is body mass. The island, sex and flipper length are the features, the inputs.
- prompt: Which column of the penguin table is categorical?
  options:
  - Flipper length in millimeters
  - Island, with the values Biscoe, Dream and Torgersen
  - Body mass in grams
  - Bill depth in millimeters
  answer: 1
  explanation: Island holds a name from a fixed set, so you can count how many penguins live on each island but not average them. The other three are quantities, where a bigger value means more of something.
- prompt: A table codes the islands as 1 for Biscoe, 2 for Dream and 3 for Torgersen. The average of Biscoe and Torgersen is (1 + 3) / 2 = 2, which is the code for Dream. What does this show?
  options:
  - Dream is really the average of the other two islands
  - Averaging works for any column of numbers
  - Island has too few values to be a feature
  - The codes are only name tags, so arithmetic on them means nothing
  answer: 3
  explanation: A category written as a number is still a category. The codes label the islands and carry no quantity, so averaging them gives nonsense.
- prompt: Penguin #154 weighs 5700 g and penguin #155 weighs 4450 g. How much heavier is #154, in grams?
  options:
  - 1250 g
  - 1150 g
  - 2200 g
  - 10150 g
  answer: 0
  explanation: Subtract the two body masses, 5700 - 4450 = 1250. Differences like this make sense because body mass is a numeric feature.
- prompt: Researchers measure 20 more penguins and add them to a table of 344 penguins. What does the table gain?
  options:
  - 20 new columns, one per penguin
  - 20 new features
  - 20 new rows, one per penguin
  - 20 new targets, one per column
  answer: 2
  explanation: Each penguin is one observation, and an observation is a row. New penguins add rows. A column would be a new kind of fact about every penguin.
- prompt: In the penguin file the rows are sorted by species, so rows 1 to 152 are Adelie. Why would the row number be a bad feature for predicting species?
  options:
  - Row numbers are not numbers
  - It looks perfect on this file, but a new penguin has no meaningful row number
  - It makes the table too wide
  - Models cannot use whole numbers
  answer: 1
  explanation: A model could learn "row 154 means Gentoo" and score perfectly on the file, but that rule says nothing about a penguin it has never seen. IDs and row numbers are bookkeeping, not facts about the penguin.
- prompt: You want to predict body mass in grams. A colleague adds a column with the same body mass in kilograms. What is wrong with using it as a feature?
  options:
  - Kilograms are not numeric
  - Kilograms are less accurate than grams
  - It is a categorical feature
  - It is a copy of the target, so it gives the answer away
  answer: 3
  explanation: 5700 g and 5.7 kg are the same fact. A feature that repeats the target looks perfect in the table, but a new penguin has no known mass to copy from.
- prompt: In the penguin file 344 rows exist, 11 of them have at least one NA cell, and two of those have no measurements at all. If you drop every row with a gap, how many rows remain?
  options:
  - 333
  - 342
  - 331
  - 344
  answer: 0
  explanation: Dropping all 11 rows with a gap leaves 344 - 11 = 333. The two rows with no measurements are already among the 11, so they are not subtracted again. The figure 342 counts only the penguins that were measured.
- prompt: Which question about the penguin table has a categorical target?
  options:
  - How heavy will this penguin be?
  - Which species is this penguin?
  - Which penguins look alike?
  - How long is its flipper?
  answer: 1
  explanation: Species is a name from a fixed set, so it is categorical. Mass and flipper length are numbers. "Which penguins look alike?" has no target column at all.
- prompt: In the plot of flipper length against body mass, which two species overlap so much that these two features barely separate them?
  options:
  - Adelie and Gentoo
  - Gentoo and Chinstrap
  - Adelie and Chinstrap
  - All three species
  answer: 2
  explanation: Gentoo penguins sit apart, with longer flippers and heavier bodies, but the Adelie and Chinstrap dots overlap on these two features. A different feature, such as bill length or depth, could separate them better.
