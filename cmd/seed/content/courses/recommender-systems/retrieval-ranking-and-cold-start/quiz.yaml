- prompt: Why does a large recommender not simply score every title with its richest model for every user?
  options:
  - The richest model is always less accurate than a cheap one
  - Scoring the whole catalog for each user would take far too long, so a cheap stage narrows it first
  - A rich model cannot use a user's history
  - Retrieval makes the ranking stage unnecessary
  answer: 1
  explanation: The two stages exist for cost. A cheap retrieval step picks a few hundred candidates, and the richer model ranks only those. Retrieval does not replace ranking, and the rich model is usually the more accurate one.
- prompt: The 300 candidates from retrieval contain 3 of the 6 titles a user will go on to like. What is the highest recall the final list can reach?
  options:
  - 1, because a perfect ranker would find the other three
  - 0.01, because 3 of the 300 candidates are relevant
  - 0.5, because only 3 of the 6 titles reached the ranker
  - 0.3, because 300 candidates were retrieved
  answer: 2
  explanation: The ranker can only order what retrieval passes on, so at most 3 of the 6 relevant titles can be shown, and recall is 3 / 6 = 0.5. The share of relevant titles among the candidates (3 / 300) is a different number.
- prompt: A brand-new title has no interactions at all. Which fallback can still place it in a list?
  options:
  - Compare its content features, such as genre and tags, with titles the user liked
  - Read its column in the interaction table, as for any other title
  - Rank it by its popularity count, which will be high
  - Leave it out of the catalog until it has many interactions
  answer: 0
  explanation: Content features exist before any user has watched the title. Its column in the table is empty, so collaborative filtering has nothing to use, and its popularity count is zero.
- prompt: A top-4 list has relevant titles at ranks 2 and 3, and the user has 5 relevant titles in all. What are precision@4 and recall@4?
  options:
  - Precision 0.4 and recall 0.5
  - Precision 0.5 and recall 0.5
  - Precision 0.2 and recall 0.5
  - Precision 0.5 and recall 0.4
  answer: 3
  explanation: Precision is the hits over the slots, 2 / 4 = 0.5. Recall is the hits over all of the user's relevant titles, 2 / 5 = 0.4. The two denominators differ, which is why the numbers differ.
- prompt: A user has exactly one relevant title, and the model puts it at rank 3. What is NDCG@5 for this list?
  options:
  - 0.33
  - 0.5
  - 0.63
  - 1
  answer: 1
  explanation: The discount at rank 3 is 1 / log2(4) = 0.5, so DCG is 0.5. The ideal list puts the one relevant title at rank 1, which gives 1, so NDCG is 0.5 / 1 = 0.5.
- prompt: Five users get 3 titles each from a catalog of 20 titles, and 6 different titles appear across all the lists. What is the catalog coverage?
  options:
  - 6 / 20 = 0.3
  - 6 / 15 = 0.4
  - 3 / 20 = 0.15
  - 6 / 3 = 2
  answer: 0
  explanation: Coverage counts the distinct titles shown to anyone and divides by the catalog size, 6 / 20 = 0.3. The 15 slots are not the denominator, because the same title can fill several slots.
- prompt: Why is a random split of the interactions a problem for a recommender?
  options:
  - It makes the test set too small to use
  - It removes users who have only one interaction
  - It can train on a user's later events to predict earlier ones, which leaks the future
  - It gives cold users an unfair advantage
  answer: 2
  explanation: A real recommender predicts what comes next. A random split mixes later events into training, so the model learns from the future. Leave-last-out holds out the latest event instead.
- prompt: In a leave-last-out test with 4 users, the held-out title lands at ranks 1, 3, 12 and 6 in their lists. What is the hit rate@5?
  options:
  - 0.25
  - 0.75
  - 1
  - 0.5
  answer: 3
  explanation: Only the ranks 1 and 3 are inside the top 5, so the hit rate is 2 / 4 = 0.5. Rank 6 just misses, and rank 12 is far outside.
- prompt: A recommender shows the most popular titles, so they get more clicks, so they look even more popular and are shown more. What is this, and what does it hurt?
  options:
  - Cold start, which retraining more often would cure
  - A feedback loop, because the system's own choices shape its data and titles never shown stay unseen
  - Leakage, which a random split would prevent
  - Overfitting, which more candidates would cure
  answer: 1
  explanation: The system's output becomes its next input. Popular titles gain exposure, and titles that are never shown never collect clicks. Watching coverage and diversity over time helps to notice it.
- prompt: A new recommender scores lower offline than the old one but wins an A/B test. What is a likely reason?
  options:
  - Offline metrics only work on old models
  - A/B tests ignore clicks
  - The log has no reaction to titles the old system never showed, so offline scoring counts them as misses
  - Online tests measure precision@k and offline tests do not
  answer: 2
  explanation: Logged data holds reactions only to what the old system showed. A model that surfaces other titles is scored as wrong offline, while real users in an A/B test can react to them.
