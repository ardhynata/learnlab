- prompt: Pada data dua cincin, k-means dan hierarchical clustering dengan single linkage masing-masing diminta membentuk 2 cluster. Apa yang ditunjukkan gambar di pelajaran?
  options:
  - Kedua metode menemukan kedua cincin
  - k-means memotong kedua cincin, sedangkan single linkage menemukannya
  - Single linkage memotong kedua cincin, sedangkan k-means menemukannya
  - Tidak ada metode yang dapat memisahkannya
  answer: 1
  explanation: k-means membentuk wilayah bulat di sekitar centroid, sehingga cincin terpotong menjadi dua bagian. Single linkage menghubungkan tetangga terdekat dan mengikuti setiap cincin sampai satu putaran, sehingga keduanya ditemukan.
- prompt: Kamu harus memasukkan setiap pelanggan ke sebuah segmen dan menggambarkan tiap segmen lewat pelanggan yang tipikal. Metode mana yang paling sesuai sebagai percobaan pertama?
  options:
  - DBSCAN, karena ia menyisihkan pelanggan yang tersesat
  - Hierarchical clustering dengan single linkage, karena ia mengikuti rantai
  - k-means, karena setiap titik mendapat kelompok dan tiap kelompok punya centroid
  - Tidak ada, karena clustering tidak dapat menggambarkan kelompok
  answer: 2
  explanation: k-means memberi kelompok pada setiap titik dan memberi tiap kelompok sebuah centroid, yaitu titik rata-rata kelompok yang dapat kamu gambarkan. DBSCAN mungkin membiarkan sebagian pelanggan sebagai noise.
- prompt: Pada dua cincin, k-means mendapat skor silhouette 0,36 dan pengelompokan yang benar mendapat 0,01. Apa yang ditunjukkan hal ini?
  options:
  - Silhouette menguntungkan kelompok padat, sehingga pengelompokan yang salah bisa bernilai lebih tinggi
  - Pengelompokan yang benar dibuat dengan buruk, karena skornya mendekati nol
  - k-means metode yang lebih baik untuk cincin, karena skornya lebih tinggi
  - Silhouette rusak dan sebaiknya tidak pernah dipakai untuk clustering apa pun
  answer: 0
  explanation: Silhouette memberi nilai tinggi pada titik yang dekat dengan kelompoknya sendiri dan jauh dari kelompok berikutnya, dan kelompok padat paling unggul dalam hal itu. Pakai silhouette untuk membandingkan pengaturan pada satu jenis data, dan plot hasilnya sebelum kamu mempercayainya.
- prompt: Hierarchical clustering dimulai dari jarak antara semua pasangan titik. Berapa banyak pasangan untuk 10.000 titik, dengan rumus n x (n - 1) / 2?
  options:
  - 10.000
  - Sekitar 100 ribu
  - Sekitar 100 juta
  - Sekitar 50 juta
  answer: 3
  explanation: 10.000 x 9.999 / 2 = 49.995.000, sekitar 50 juta. Rumus n x n menghasilkan 100 juta, yang menghitung setiap pasangan dua kali dan setiap titik dengan dirinya sendiri.
- prompt: Dua penguin berbeda 0,4 mm, 1,3 mm, 5 mm, dan 50 g pada keempat pengukurannya. Selisih kuadratnya 0,16, 1,69, 25, dan 2.500. Sekitar berapa persen jarak kuadrat yang berasal dari massa tubuh?
  options:
  - Sekitar 1 persen
  - Sekitar 25 persen
  - Sekitar 99 persen
  - Sekitar 50 persen
  answer: 2
  explanation: Jumlahnya 2.526,85 dan 2.500 / 2.526,85 sekitar 0,989. Kolom dengan angka terbesar mengambil alih jarak kalau kamu tidak melakukan scaling pada feature lebih dulu.
- prompt: DBSCAN dengan MinPts 4 pada data dengan kepadatan tidak seimbang menghasilkan 2 cluster dan 11 titik noise pada eps 1,0, tetapi 4 cluster dan 29 titik noise pada eps 0,5. Bagaimana membacanya dengan paling tepat?
  options:
  - eps 0,5 yang benar, karena menemukan lebih banyak cluster dan lebih rinci
  - Hasilnya sensitif terhadap eps, jadi uji kestabilan dan plot sebelum mempercayai salah satunya
  - Data ini punya 4 cluster, karena eps yang lebih kecil melihat data lebih teliti
  - DBSCAN bersifat acak, sehingga hasilnya tidak dapat diulang dari satu putaran ke berikutnya
  answer: 1
  explanation: Perubahan kecil pada satu pengaturan mengubah ceritanya, dan itu peringatan. Kelompok yang rapat dan kelompok yang longgar membutuhkan radius berbeda, sehingga satu eps kesulitan untuk keduanya.
- prompt: Kamu punya 400 titik dan belum tahu ada berapa kelompok. Metode mana yang memungkinkan kamu mempelajari strukturnya dulu dan memilih k sesudahnya?
  options:
  - k-means, yang membutuhkan k sebelum mulai
  - DBSCAN, yang selalu menemukan jumlah kelompok yang sebenarnya
  - Metode apa pun, karena k hanyalah label
  - Hierarchical clustering, dengan memotong dendrogram pada ketinggian yang berbeda
  answer: 3
  explanation: Hierarchical clustering membangun seluruh pohon penggabungan satu kali. Setelah itu kamu memotongnya untuk mendapat 2, 3, atau 4 cluster. k-means membutuhkan k di awal, dan DBSCAN membutuhkan eps dan MinPts.
- prompt: Pada penguin, standardisasi kolom menurunkan silhouette dari 0,58 menjadi 0,45, tetapi menaikkan persentase penguin yang sekelompok dengan spesiesnya dari 68 menjadi 92 persen. Bagaimana membacanya dengan paling tepat?
  options:
  - Cluster mentah hanya mengikuti massa tubuh, sehingga skor lebih rendah tidak berarti lebih buruk
  - Standardisasi merusak data, karena skor silhouette-nya turun
  - Silhouette selalu benar, jadi cluster dari kolom mentah yang lebih baik
  - Pemeriksaan spesies keliru, karena spesies tidak dipakai untuk clustering
  answer: 0
  explanation: Jarak pada kolom mentah didominasi massa tubuh (untuk dua penguin di atas, sekitar 99 persen), sehingga cluster-nya padat pada satu kolom dan maknanya kecil. Pemeriksaan spesies memakai informasi yang tidak pernah dilihat clustering, itulah sebabnya ia dapat dipercaya di sini.
- prompt: Beberapa titik tersesat yang jauh berada di samping tiga gumpalan. Apa yang terjadi pada k-means dan pada DBSCAN?
  options:
  - Keduanya menyisihkan titik tersesat sebagai noise, jadi gumpalan tetap bersih
  - k-means memasukkan titik tersesat ke kelompok dan menarik centroid; DBSCAN dapat memberinya noise
  - DBSCAN memaksa titik tersesat masuk kelompok, sedangkan k-means dapat memberinya noise
  - Tidak ada metode yang menyadari titik tersesat, sehingga tak berpengaruh
  answer: 1
  explanation: k-means memberi kelompok pada setiap titik, dan titik yang jauh menarik rata-rata kelompoknya ke arahnya. DBSCAN memberi label noise pada titik di ruang yang jarang.
- prompt: Kamu ragu metode mana yang sesuai untuk data baru. Rencana mana yang sejalan dengan pelajaran?
  options:
  - Jalankan semua metode dan simpan yang skor silhouette-nya paling tinggi
  - Jalankan k-means dengan banyak seed dan percayai inertia terendah
  - Plot data, lakukan scaling pada feature, jalankan dua metode berbeda, lalu bandingkan
  - Pilih DBSCAN, karena tidak membutuhkan k
  answer: 2
  explanation: Kesepakatan antara dua metode yang melihat bentuk secara berbeda, seperti k-means dan DBSCAN, adalah bukti bahwa strukturnya nyata; k-means dan ward hampir kembar, sehingga kesepakatan keduanya tidak banyak berarti. Ketidaksepakatan adalah pertanyaan yang perlu diselidiki. Satu skor tidak dapat menjadi wasit antarmetode yang melihat bentuk berbeda.
