- prompt: What does agglomerative hierarchical clustering do at each step?
  options:
  - Splits the biggest cluster into two
  - Moves each center to the mean of its points
  - Merges the two closest clusters into one
  - Removes the point that is farthest from the rest
  answer: 2
  explanation: It starts with every point alone and keeps merging the two closest clusters. Moving centers is k-means, not this method.
- prompt: Five points are clustered with agglomerative clustering until one cluster is left. How many merges happen?
  options:
  - 4
  - 5
  - 10
  - 2
  answer: 0
  explanation: Each merge removes one cluster, going from 5 clusters to 1, so there are 5 - 1 = 4 merges.
- prompt: Using the five points A = 0, B = 1, C = 3, D = 7, E = 12, what is the complete-linkage distance between {A, B} and C?
  options:
  - 2
  - 3
  - 2.5
  - 4
  answer: 1
  explanation: Complete linkage takes the farthest pair. A-C is 3 and B-C is 2, so the larger value, 3, is used. Single linkage would give 2 and average linkage 2.5.
- prompt: With average linkage on the same points, what is the distance between {A, B, C} and D?
  options:
  - 4
  - 5.67
  - 7
  - 17
  answer: 1
  explanation: The three pair distances are A-D = 7, B-D = 6 and C-D = 4. Their mean is 17 / 3, about 5.67. The value 17 is their sum, which is not divided by the number of pairs.
- prompt: A complete-linkage dendrogram has merges at heights 1, 3, 5 and 12. You cut it at height 4. How many clusters do you get?
  options:
  - 2
  - 4
  - 5
  - 3
  answer: 3
  explanation: Two merges (at 1 and 3) are below the cut, so 5 - 2 = 3 clusters remain, here {A, B, C}, {D} and {E}.
- prompt: In the same dendrogram nothing merges between height 5 and height 12. What does that long gap suggest?
  options:
  - The data has two natural clusters, so a cut inside the gap is a good choice
  - The data has 12 clusters
  - The tree was drawn wrongly
  - Every point should stay in its own cluster
  answer: 0
  explanation: A long gap means the groups below it are far from each other. Cutting inside the gap leaves 2 clusters. It is a hint, not a proof.
- prompt: Which linkage is most likely to chain, joining two separate groups through a thin bridge of stray points?
  options:
  - Complete
  - Ward
  - Single
  - They all chain equally
  answer: 2
  explanation: Single linkage only needs one close pair, so a line of nearby points can link groups one step at a time. Complete and Ward look at whole clusters and resist this.
- prompt: Which linkage tends to give round clusters of similar size, much like k-means?
  options:
  - Single
  - Ward
  - None; hierarchical clustering cannot make round clusters
  - Only single linkage on a line
  answer: 1
  explanation: Ward merges the pair that adds the least squared distance from the cluster centers, which is the quantity k-means minimizes. That favors compact, round, similar-size clusters.
- prompt: A friend says, "Hierarchical clustering is better because you never have to choose the number of clusters." What is the most accurate reply?
  options:
  - Correct; the tree decides the number for you
  - Wrong; you must give k before the first merge
  - Wrong; it only works when k is 2
  - Partly right; you do not give k first, but you still choose it when you cut the tree
  answer: 3
  explanation: The merging runs without k, but turning the tree into clusters needs a cut, and the cut is a choice. A long gap helps, but it does not decide for you.
