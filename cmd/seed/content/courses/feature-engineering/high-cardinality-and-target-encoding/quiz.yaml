- prompt: A table has 2,000 customers and a zip code column with 412 different values. How many columns does one-hot encoding write for that column?
  options:
  - 1
  - 3
  - 412
  - 2,000
  answer: 2
  explanation: One-hot encoding writes one column per category, so 412 columns, almost all zeros, for only 2,000 rows. The other options mix up the number of categories with the number of rows or with a low-cardinality column.
- prompt: Why can frequency encoding not leak the label?
  options:
  - It is built only from how often each category appears, and never reads the label
  - It is computed on the test rows instead of the training rows
  - It gives every category the same number
  - It averages the label of each category, then rounds the result
  answer: 0
  explanation: A count or share of rows needs no label, so no label can slip into it. Its price is that it only helps when how common a category is relates to the label. The counts still come from the training rows.
- prompt: Zip C has 3 training customers, all of whom bought. The overall mean is 0.40 and m = 4. What is the smoothed target encoding of C?
  options:
  - 1.00, because every customer bought
  - 0.40, the overall mean
  - 0.52
  - 0.66
  answer: 3
  explanation: (3 × 1.00 + 4 × 0.40) / (3 + 4) = 4.6 / 7 = 0.66. The value 0.52 belongs to zip D, which has only one customer, and 1.00 is the unsmoothed mean.
- prompt: In smoothed target encoding, what happens to the encoded values when you raise m?
  options:
  - They move toward each category's own mean
  - They move toward the overall mean, so small categories are trusted less
  - Only categories with no rows change
  - Nothing, because m only changes the order of the categories
  answer: 1
  explanation: m acts like m imaginary customers at the overall mean added to every category. A bigger m gives them more weight, so every encoded value is pulled toward the overall mean, most strongly for categories with few rows.
- prompt: A category has 10 training rows with an own mean of 0.80. The overall mean is 0.40 and m = 10. What is its smoothed encoding?
  options:
  - 0.40
  - 0.70
  - 0.60
  - 0.80
  answer: 2
  explanation: (10 × 0.80 + 10 × 0.40) / (10 + 10) = 12 / 20 = 0.60. Because n equals m, the category's own mean and the overall mean get equal weight, so the result is halfway between them.
- prompt: Why does naive target encoding, fitted and applied on the same training rows, leak the label?
  options:
  - It uses the rows of the test set to find the category means
  - It sorts the rows by label before it encodes them
  - It removes the rows that are hardest to predict from the table
  - Each row's own label is part of the category mean that becomes its feature
  answer: 3
  explanation: "A row's label shifts the mean of its own category, so the feature carries a piece of the answer. The effect is strongest for categories with few rows: a zip code with one customer is encoded as that customer's label."
- prompt: In the out-of-fold example, the only customer from zip D sits in fold 1, and the other 16 customers include 5 buyers. With m = 4, what encoding does that customer get?
  options:
  - 0.31, the overall mean of the other folds
  - 1.00, the customer's own label
  - 0.40, the overall mean of all 20 customers
  - 0.00, because no other D customer exists
  answer: 0
  explanation: The table is built from the other folds, which hold no D rows, so n = 0 and the encoding is the overall mean of those rows, 5 / 16 = 0.3125, about 0.31. The label of the customer itself is never used.
- prompt: In a simulation, the zip code is useless and the label is a coin flip. Naive target encoding scores 71.7% on the training rows and 50.0% on fresh rows. What does this show?
  options:
  - The model is underfitting and needs a bigger m to fit the training rows
  - The fresh rows were drawn from a different population than the training rows
  - The zip code is a strong feature that only needs more data to show it
  - "Leakage: the encoding carried the training labels, so the training score is not real"
  answer: 3
  explanation: With a coin-flip label nothing can be learned from the zip code, so 50.0% on fresh rows is the true level. The 21.7 extra points on the training rows came from labels hidden in the feature. Smoothing with m = 10 gave the same 71.7% and 50.0%.
- prompt: You compare features with 5-fold cross-validation, and one feature is a target-encoded zip code. Where should the encoding be fitted?
  options:
  - Once on all the rows, before the folds are cut
  - In each round, from the training folds only, with the validation fold encoded by that table
  - On the validation fold, because it is the fold that needs encoding
  - It does not matter, because the label is never shown to the model
  answer: 1
  explanation: A target encoder reads the label, so it has to be fitted inside each round on the training folds. Fitting it on all rows puts every validation label into its own encoding, and the cross-validation score is then inflated.
- prompt: A teammate says that smoothing makes naive target encoding safe. Which reply is best?
  options:
  - Right, smoothing removes each row's label from its own category mean
  - Right, but only if m is above 100 for every category
  - No. Smoothing shrinks small categories, but each row's label is still inside its own encoding
  - No. Smoothing makes the leak worse for rare categories
  answer: 2
  explanation: Smoothing controls how much a tiny category is trusted. It does not take a row's own label out of the mean. In the coin-flip tables naive encoding with m = 10 still scored 71.7% on training rows and 50.0% on fresh rows.
